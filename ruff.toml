line-length = 100
target-version = "py312"
extend-exclude = ["**/templates/**", "**/.eval-runs/**", "skills/solve-take-home/**"]

# The installed adapter runs under the host python3, including macOS Python 3.9.
[per-file-target-version]
"hooks/PreToolUse/engine/codex_adapter.py" = "py39"

[lint]
select = ["E", "F", "I", "UP", "B"]

[lint.isort]
known-first-party = ["engine", "src", "setup_config"]

[lint.per-file-ignores]
# Tests can have longer lines and more imports
"**/tests/**" = ["E501"]
# Scripts that manipulate sys.path before imports
"scripts/test-scaffolds.py" = ["E402"]
"hooks/PreToolUse/tests/operations/test_bash.py" = ["E402"]
