name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Hook tests
        run: make test-hooks

      - name: setup.sh helper tests
        run: make test-scripts

      - name: create-repo tests (unit + structural eval)
        run: cd skills/create-repo && uv run pytest tests/ -v -m "not e2e"

  scaffold-paths:
    name: Check scaffold paths
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.scaffold }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            scaffold:
              - 'skills/create-repo/templates/**'
              - 'skills/create-repo/scripts/**'
              - 'skills/create-repo/eval/**'
              - 'skills/create-repo/pyproject.toml'
              - 'skills/create-repo/uv.lock'
              - 'Makefile'

  scaffold-e2e:
    name: Scaffold E2E
    needs: scaffold-paths
    if: needs.scaffold-paths.outputs.changed == 'true'
    # Scaffolded Playwright versions support Ubuntu 24.04.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eval_project_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - uses: extractions/setup-just@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Scaffold and verify all templates
        run: make test-scaffolds TEMPLATE=all
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eval_project_dev
